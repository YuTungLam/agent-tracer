[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "boundary-agent"
version = "0.1.0"
description = "A LangGraph agent for tool-output injection research."
requires-python = ">=3.11"
dependencies = [
    "langchain-groq==1.1.3",
    "langgraph==1.2.11",
]

[dependency-groups]
dev = [
    "pytest>=8.4,<10",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
